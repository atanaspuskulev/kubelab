all:
  children:
    hypervisors:
      hosts:
        kubelab:
          ansible_host: "{{ lookup('ansible.builtin.env', 'KUBELAB_IP', default=undef('KUBELAB_IP is required')) }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'KUBELAB_USER', default=undef('KUBELAB_USER is required')) }}"
          ansible_python_interpreter: /usr/bin/python3
          # If we need to override the default remote `sudo`, we just can
          # override it in our environment. Use `KUBELAB_SUDO` to determine
          # the remote `sudo` command.
          ansible_become_exe: "{{ lookup('ansible.builtin.env', 'KUBELAB_SUDO', default='/usr/bin/sudo') }}"

    k3s_cluster:
      children:
        k3s_servers:
          hosts:
            k3s-control-1:
              ansible_host: 10.20.0.10

        k3s_agents:
          hosts:
            k3s-worker-1:
              ansible_host: 10.20.0.11
            k3s-worker-2:
              ansible_host: 10.20.0.12

      vars:
        ansible_user: ubuntu
        ansible_ssh_common_args: >-
          -o ProxyJump={{ lookup('ansible.builtin.env', 'KUBELAB_USER') }}@{{ lookup('ansible.builtin.env', 'KUBELAB_IP') }}
          -o StrictHostKeyChecking=accept-new

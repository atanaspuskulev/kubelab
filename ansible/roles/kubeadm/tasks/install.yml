---
- name: Install Kubernetes components
  ansible.builtin.apt:
    name:
      - kubeadm
      - kubelet
      - kubectl
    state: present

- name: Hold installed Kubernetes packages for explicit upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl

- name: Enable kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Install Kubernetes CRI troubleshooting tools
  ansible.builtin.apt:
    name: "cri-tools={{ kube_cri_tools_version }}"
    state: present

- name: Configure crictl runtime endpoint
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"

- name: Verify CRI runtime
  ansible.builtin.command:
    argv:
      - crictl
      - info
  register: cri_runtime_info
  changed_when: false


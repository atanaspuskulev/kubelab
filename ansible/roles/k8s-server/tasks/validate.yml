---
- name: Validate Kubernetes API server readiness
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - --raw=/readyz
  register: k8s_api_ready
  changed_when: false
  retries: 12
  delay: 5
  until:
    - k8s_api_ready.rc == 0
    - k8s_api_ready.stdout | trim == 'ok'

- name: Get Kubernetes node information
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - json
  register: k8s_node
  changed_when: false

- name: Validate control-plane label
  ansible.builtin.assert:
    that:
      - "'node-role.kubernetes.io/control-plane' in (k8s_node.stdout | from_json).metadata.labels"
    fail_msg: "Control-plane label is missing"
    success_msg: "Control-plane label is present"

- name: Validate control-plane taint
  ansible.builtin.assert:
    that:
      - >-
        ((k8s_node.stdout | from_json).spec.taints | default([]))
        | selectattr('key', 'equalto', 'node-role.kubernetes.io/control-plane')
        | selectattr('effect', 'equalto', 'NoSchedule')
        | list | length > 0
    fail_msg: "Control-plane NoSchedule taint is missing"
    success_msg: "Control-plane NoSchedule taint is present"

- name: Validate kubeadm configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - configmap
      - kubeadm-config
      - -n
      - kube-system
  changed_when: false

- name: Validate cluster bootstrap information
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - configmap
      - cluster-info
      - -n
      - kube-public
  changed_when: false

- name: Validate CoreDNS deployment
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - deployment
      - coredns
      - -n
      - kube-system
  changed_when: false

- name: Validate kube-proxy DaemonSet
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - daemonset
      - kube-proxy
      - -n
      - kube-system
  changed_when: false

- name: Get Kubernetes system Pods
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - pods
      - -n
      - kube-system
      - -o
      - json
  register: k8s_system_pods
  changed_when: false

- name: Validate static control-plane Pods
  ansible.builtin.assert:
    that:
      - >-
        (
          (k8s_system_pods.stdout | from_json)['items']
          | selectattr('metadata.name', 'equalto', item ~ '-' ~ inventory_hostname)
          | selectattr('status.phase', 'equalto', 'Running')
          | list
          | length
        ) == 1
    fail_msg: "{{ item }} is not Running"
    success_msg: "{{ item }} is Running"
  loop:
    - etcd
    - kube-apiserver
    - kube-controller-manager
    - kube-scheduler

- name: Get finalized kubelet client certificate reference
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_kubelet_config }}"
      - config
      - view
      - --minify
      - "-o=jsonpath={.users[0].user.client-certificate}"
  register: kubelet_cert_validation
  changed_when: false

- name: Get finalized kubelet client key reference
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_kubelet_config }}"
      - config
      - view
      - --minify
      - "-o=jsonpath={.users[0].user.client-key}"
  register: kubelet_key_validation
  changed_when: false

- name: Validate kubelect client certificate rotation configuration
  ansible.builtin.assert:
    that:
      - kubelet_cert_validation.stdout | trim == kube_kubelet_client_cert
      - kubelet_key_validation.stdout | trim == kube_kubelet_client_cert
    fail_msg: "Kubelet does not reference the rotating client certificate"
    success_msg: "Kubelet references the rotating client certificate"

- name: Validate kubelet service is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - kubelet
  register: kubelet_service_status
  changed_when: false
  retries: 10
  delay: 3
  until:
    - kubelet_service_status.rc == 0
    - kubelet_service_status.stdout | trim == 'active'

- name: Validate kubelet configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - configmap
      - kubelet-config
      - -n
      - kube-system
  changed_when: false

- name: Validate kubelet configuration RoleBinding
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - rolebinding
      - kubeadm:kubelet-config
      - -n
      - kube-system
  changed_when: false

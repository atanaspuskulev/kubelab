---
- name: Configure Kubernetes control plane
  ansible.builtin.import_tasks: configure.yml

- name: Initialize Kubernetes control plane
  ansible.builtin.import_tasks: initialize.yml

- name: Recover missing adminiistrator RBAC
  ansible.builtin.import_tasks: recover-admin-rbac.yml  


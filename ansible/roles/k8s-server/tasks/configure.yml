---
- name: Create Kubernetes configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Generate Kubernetes configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yml
    owner: root
    group: root
    mode: "0644"

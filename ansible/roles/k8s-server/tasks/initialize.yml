---
- name: Check Kubernetes admin configuration
  ansible.builtin.stat:
    path: "{{ kube_admin_config }}"
  register: kubernetes_admin_conf

- name: Check existing static pod manifests
  ansible.builtin.find:
    paths: "{{ kube_manifests_dir }}"
    file_type: file
    hidden: true
    recurse: false
    excludes:
      - ".kubelet-keep"
  register: kubernetes_static_manifests

- name: Check existing etcd data
  ansible.builtin.stat:
    path: "{{ kube_etcd_data_dir }}/member"
  register: kubernetes_etcd_data

- name: Initialize Kubernetes control plane
  become: true
  block:
    - name: Run kubeadm init
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --config
          - "{{ kube_kubeadm_config }}"
        creates: "{{ kube_admin_config }}"
      when: not kubernetes_admin_conf.stat.exists

    - name: Create .kube directory to expose the config to the common VM user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Copy admin.conf into VM user kubeconfig folder
      ansible.builtin.copy:
        src: "{{ kube_admin_config }}"
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
    
- name: Check Kubernetes API server readiness
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - --request-timeout=5s
      - get
      - --raw=/readyz
  register: kubernetes_api_check
  changed_when: false
  failed_when: false
  when: kubernetes_admin_conf.stat.exists

- name: Determine Kubernetes initialization state
  ansible.builtin.set_fact:
    kubernetes_initialization_state: >-
      {{
        'uninitialized'
        if (
          not kubernetes_admin_conf.stat.exists
          and kubernetes_static_manifests.matched == 0
          and not kubernetes_etcd_data.stat.exists
        )
        else 'operational'
        if (
          kubernetes_admin_conf.stat.exists
          and kubernetes_api_check.rc | default(1) == 0
        ) else 'incomplete_or_unhealthy'
      }}

- name: Kubernetes initialization state
  ansible.builtin.debug:
    var: kubernetes_initialization_state

- name: Protect existing kubernetes control-plane
  ansible.builtin.fail:
    msg: >-
      Existing Kubernetes initialization artifacts were detected,      
      but the API server is not operational or admin.conf is missing.
      Manual investigation is required.
      Automatic initialization or reset will not be attempted.
  when: >-
    kubernetes_initialization_state == 'incomplete_or_unhealthy'

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - "{{ kube_kubeadmin_config }}"
    creates: "{{ kube_admin_config }}"
  when: kubernetes_initialization_state == 'uninitialized'

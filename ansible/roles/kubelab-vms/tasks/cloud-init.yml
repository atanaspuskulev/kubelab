
---
- name: Create cloud-init directories
  ansible.builtin.file:
    path: "{{ kubelab_vm_storage_path }}/{{ item.name }}-cloud-init"
    state: directory
    mode: "0755"
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate cloud-init user-data
  ansible.builtin.template:
    src: user-data.yml.j2
    dest: "{{ kubelab_vm_storage_path }}/{{ item.name }}-cloud-init/user-data"
    mode: "0644"
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  register: cloud_init_user_data

- name: Generate cloud-init meta-data
  ansible.builtin.template:
    src: meta-data.yml.j2
    dest: "{{ kubelab_vm_storage_path }}/{{ item.name }}-cloud-init/meta-data"
    mode: "0644"
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  register: cloud_init_meta_data

- name: Validate cloud-init user-data
  ansible.builtin.command:
    argv:
      - cloud-init
      - schema
      - --config-file
      - "{{ kubelab_vm_storage_path }}/{{ item.name }}-cloud-init/user-data"
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Calculate cloud-init input checksum
  ansible.builtin.stat:
    path: "{{ kubelab_vm_storage_path }}/{{ item.0.name }}-cloud-init/{{ item.1 }}"
    checksum_algorithm: sha256
  loop: "{{ kubelab_vms | product(['user-data', 'meta-data']) | list }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  register: cloud_init_input_stats

- name: Verify cloud-init seed ISOs
  ansible.builtin.stat:
    path: "{{ kubelab_vm_storage_path }}/{{ item.name }}-seed.iso"
  loop: "{{ kubelab_vms }}"
  register: cloud_init_isos

- name: Read persisted input checksums
  ansible.builtin.slurp:
    src: "{{ kubelab_vm_storage_path }}/{{ item.name }}-cloud-init/inputs.sha256"
  loop: "{{ kubelab_vms }}"
  register: cloud_init_saved_checksums
  failed_when: false
  changed_when: false

- name: Reconcile cloud-init seed ISOs
  ansible.builtin.include_tasks: seed-iso.yml
  loop: "{{ kubelab_vms }}"
  loop_control:
    loop_var: vm
    index_var: vm_index
    label: "{{ vm.name }}"


---
- name: Check whether VMs already exists
  ansible.builtin.command:
    argv:
      - virsh
      - dominfo
      - "{{ item.name }}"
  loop: "{{ kubelab_vms }}"
  loop_control: 
    label: "{{ item.name }}"
  register: existing_vms
  failed_when: false
  changed_when: false
  check_mode: false

- name: Define and start VMs
  ansible.builtin.command:
    argv:
      - virt-install
      - --name
      - "{{ item.item.name }}"
      - --memory
      - "{{ item.item.memory_mb }}"
      - --import
      - --disk
      - "path={{ kubelab_vm_storage_path }}/{{ item.item.name }}.qcow2,format=qcow2,bus=virtio"
      - --disk
      - "path={{ kubelab_vm_storage_path }}/{{ item.item.name }}-seed.iso,device=cdrom"
      - --network
      - "network={{ kubelab_vm_network }},mac={{ item.item.mac }},model=virtio"
      - --vcpus
      - "{{ item.item.vcpus }}"
      - --os-variant
      - ubuntu24.04
      - --graphics
      - none
      - --noautoconsole
  loop: "{{ existing_vms.results }}"
  loop_control: 
    label: "{{ item.item.name }}"
  changed_when: true
  when: item.rc != 0

- name: Ensure VMs are running
  community.libvirt.virt:
    name: "{{ item.name }}"
    state: running
    uri: qemu:///system
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check VMs autostart
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - dominfo
      - "{{ item.name }}"
  register: vm_dominfo
  loop: "{{ kubelab_vms }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Enable VMs autostart
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - autostart
      - "{{ item.item.name }}"
  loop: "{{ vm_dominfo.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: >-
    (item.stdout | regex_search('(?m)^Autostart:\s+enable\s*$')) is none
  changed_when: true

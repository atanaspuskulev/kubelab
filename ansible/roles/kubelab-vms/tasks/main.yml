---
- name: Download Ubuntu Cloud image
  ansible.builtin.get_url:
    url: "{{ kubelab_vm_image_url }}"
    dest: "{{ kubelab_vm_storage_path }}/ubuntu-24.04-base.img"
    mode: "0644"

- name: Create VM disks
  ansible.builtin.import_tasks: disks.yml

- name: Configure cloud-init
  ansible.builtin.import_tasks: cloud-init.yml

- name: Configure VM DHCP reservations
  ansible.builtin.import_tasks: dhcp.yml

- name: Provision virtual machines
  ansible.builtin.import_tasks: provision.yml

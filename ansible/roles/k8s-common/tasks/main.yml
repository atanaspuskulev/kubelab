---
- name: Install required packages
  ansible.builtin.apt:
    name: "{{ k8s_required_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable active swap
  ansible.builtin.command:
    cmd: swapoff -a
  when:
    - k8s_disable_swap | bool
    - ansible_facts['swaptotal_mb'] | int > 0

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
  when: k8s_disable_swap | bool

- name: Configure Kubernetes kernel and networking
  ansible.builtin.import_tasks: kernel.yml

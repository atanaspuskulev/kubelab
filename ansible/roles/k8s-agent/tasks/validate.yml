---
- name: Wait for worker registration in Kubernetes API
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kube_admin_config }}"
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - name
  delegate_to: "{{ groups['k8s_servers'][0] }}"
  become: true
  register: worker_registration_result
  changed_when: false
  retries: 12
  delay: 5
  until: worker_registration_result.rc == 0


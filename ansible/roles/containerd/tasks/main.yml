---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure containerd configuration directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Check whether containerd configuration exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

- name: Generate default containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_default_config
  when: not containerd_config.stat.exists
  changed_when: false

- name: Write default containerd configuration
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout }}\n"
    dest: /etc/containerd/config.toml
    mode: "0644"
  when: not containerd_config.stat.exists

- name: Enable systemd cgroup management
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Apply pending containerd configuration
  ansible.builtin.meta: flush_handlers


